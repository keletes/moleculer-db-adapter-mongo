name: Tag release

# Trunk-based release: every push to main runs semantic-release, which parses the Conventional Commit messages since
# the last release (see pr-title.yml and CLAUDE.md) to decide whether and what to release. When it does:
#   1. the version is set in package.json (working tree only, never committed)
#   2. `yarn build` regenerates dist/ (prepareCmd in .releaserc.json)
#   3. the package is published to GitHub Packages (npm.pkg.github.com) with the job's GITHUB_TOKEN
#   4. the vX.Y.Z tag is created and a GitHub Release is published
#
# No release commit is pushed back (protected main rejects it); package.json's version is a placeholder.
# The tag and release use the GitHub App installation token (same org-level DEPLOY_APP_ID / DEPLOY_APP_PRIVATE_KEY
# secrets as the services); checkout must be authenticated with it up front.
on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: keletes
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          registry-url: https://npm.pkg.github.com
          scope: '@keletes'

      # Public repo and no private packages: no PACKAGES_READ_PAT step.
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1" # no mongod needed here

      - name: Release
        run: yarn semantic-release
        env:
          # Tag and GitHub release use the App token; the package publish uses the job's own GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
